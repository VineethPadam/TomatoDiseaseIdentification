# ===================================================================
# Tomato Leaf Disease Identification System - Spring Boot Application
# Model: LeafVision-DINO (ViT-S/16) | Indicators: AgERA5 v2.0
# Framework: Spring Boot 3 + Spring AI + MySQL Database
# ===================================================================

server.port=8080

# Application Name
spring.application.name=TomatoLeafVisionBackend

# Database Configuration:
# Defaults to H2 in-memory DB for 100% reliable out-of-the-box viva demos.
# To connect to your MySQL 9.4 server, activate profile 'mysql' or configure below:
spring.datasource.url=jdbc:h2:mem:tomato_leaf_disease;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Static Resource Handling (Frontend HTML/CSS/JS)
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# Multipart File Upload Limits (for High-Res Tomato Leaf Photos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ML/DL Vision Transformer FastAPI Service Endpoint
ml.service.url=http://127.0.0.1:8000

# Spring AI Configuration (Supports OpenAI, Gemini, or Local LLM)
spring.ai.openai.api-key=${OPENAI_API_KEY:optional_for_live_llm}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.3

# Storage Directory for Uploaded Tomato Leaves
upload.dir=./uploads
